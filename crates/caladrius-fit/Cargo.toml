[package]
name = "caladrius-fit"
description = "Layer L0: weighted least-squares fitting of pharmacokinetic models, with diagnostics."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The models being fitted (same layer, L0).
caladrius-models = { path = "../caladrius-models" }
# Terminal-phase selection for the initial estimates (FIT-INI-03, 04 refer to NCA-LZ-02 to 05).
caladrius-nca = { path = "../caladrius-nca" }
# Inputs, options and results are data (golden rule 4).
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
caladrius-testkit = { path = "../caladrius-testkit" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[lints]
workspace = true
